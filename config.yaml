all:
    outputdir: &outputdir 'outputs'
    inputfiles: &inputfiles 'input_files'
    colorlist: "analysis_scripts/color_list.py"

z00: #cofactor exploration step
    dataloc: '/project/iprime_storage/myles_kim/_Spect_Analysis/_Allcell/_subsample_100k_bcell'  # data location
    figure_dir: 'z00_figures_for_spectral_cofactor' #figures will be saved here
    cofactorlist: "[1000.0, 2000.0, 5000.0, 8000.0, 10000.0, 12000.0]"     #cofactors to use. have minimum of 6 values
    dataset: "SpectralB"
    plotbysubj: False
    numpool: 10
    savefile_fcs_trimmed: &fcstrimmed 'fcs_df_trimmed.csv.gz' #fcs data with all markers. Not transformed
z01:   #batch correction
    figure_dir: 'z01_figures_for_batch_correct'
    fcstrimmed: *fcstrimmed #'fcs_df_trimmed.csv.gz' #z00.savefile_fcs_trimmed
    cofactorfile: &cofactor 'cofactors.csv'
    batchinfo: 'batch.csv'
    numpool: 4
z02:
    fcsdata: 'fcs_df_cycombine_BCed.csv.gz'
    label: &label 'b_cell_LLM2'
    figure_dir: "z02_figures_for_spectral_umap"
    cofactorfile: *cofactor
    min_distance: 0.01
    fcs_umap_savefile: &fcs_umap_savefile 'fcs_data_umap.csv.gz'
z03:
    label: *label
    rp_list: &rp_list "[round(x*0.05,3) for x in range(2,11)]"   # eval()ed
    save_dir: &partition 'z03_partition'
z04:
    cofactorfile: *cofactor #'cofactors.csv'
    figure_dir: 'round_one_clustering'
    load_dir: *partition
    figure_dir: 'z04_round_one_clustering'
    label: *label
    rp_list: *rp_list
    fcs_umap_savefile: *fcs_umap_savefile
    numpool: 4   # lower if experience memory problems
